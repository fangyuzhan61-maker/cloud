<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow — 個人待辦事項</title>
    <!-- Google 字體與現代圖標庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1080px;
        }

        /* 頂部 Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
        }

        .brand-title h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }

        .brand-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 雙欄主架構 (桌機雙欄、手機自動單欄) */
        .layout-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 820px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 左側：表單卡片 */
        .form-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 30px;
        }

        .card-heading {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 6px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-title);
            background-color: #f8fafc;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        button.btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        button.btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.45);
        }

        button.btn-submit:active {
            transform: translateY(0);
        }

        /* 右側：任務清單 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .list-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-title);
        }

        .counter-badge {
            font-size: 0.8rem;
            font-weight: 700;
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 任務卡片 */
        .task-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-title);
            line-height: 1.4;
        }

        /* 膠囊徽章 */
        .priority-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .priority-高 {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .priority-中 {
            background-color: #fef3c7;
            color: #d97706;
        }
        .priority-低 {
            background-color: #ecfdf5;
            color: #059669;
        }

        .task-desc {
            font-size: 0.92rem;
            color: var(--text-body);
            line-height: 1.6;
            white-space: pre-line;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            margin-top: 6px;
        }

        /* 空狀態 */
        .empty-box {
            background: white;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 45px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-box i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- 頂部標頭 -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="brand-title">
                    <h1>Task Flow</h1>
                    <p>直覺、清爽的日常代辦管理空間</p>
                </div>
            </div>
        </header>

        <!-- 雙欄排版 -->
        <div class="layout-grid">
            <!-- 左欄：輸入表單 -->
            <div class="form-card">
                <div class="card-heading">
                    <i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i>
                    <span>建立新任務</span>
                </div>
                <form method="POST">
                    <div class="form-field">
                        <label for="task_name">任務名稱</label>
                        <input type="text" id="task_name" name="task_name" placeholder="想完成什麼目標？" required autocomplete="off">
                    </div>

                    <div class="form-field">
                        <label for="priority">重要等級</label>
                        <select id="priority" name="priority" required>
                            <option value="高">🔴 高優先級 (High)</option>
                            <option value="中" selected>🟡 中優先級 (Medium)</option>
                            <option value="低">🟢 低優先級 (Low)</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="details">詳細內容</label>
                        <textarea id="details" name="details" rows="4" placeholder="填寫詳細步驟、備忘事項或預計期限..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i>
                        加入待辦清單
                    </button>
                </form>
            </div>

            <!-- 右欄：任務清單 -->
            <div class="list-section">
                <div class="list-header">
                    <h2>待辦列表</h2>
                    <span class="counter-badge">{{ tasks|length }} 項待辦</span>
                </div>

                <div class="tasks-container">
                    {% for task in tasks %}
                        <div class="task-card">
                            <div class="task-top">
                                <h3 class="task-title">{{ task.task_name }}</h3>
                                <span class="priority-pill priority-{{ task.priority }}">
                                    <i class="fa-solid fa-circle" style="font-size: 6px;"></i>
                                    {{ task.priority }}級
                                </span>
                            </div>
                            <div class="task-desc">{{ task.details }}</div>
                        </div>
                    {% else %}
                        <div class="empty-box">
                            <i class="fa-solid fa-clipboard-check"></i>
                            <p>太棒了！目前沒有任何待辦事項。</p>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

</body>
</html>
